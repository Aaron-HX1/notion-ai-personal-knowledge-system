<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="配置示意，未包含真实密钥"><rect width="960" height="360" rx="24" fill="#18181b"/><g font-family="sans-serif" fill="#fafafa"><text x="32" y="44" font-size="24" font-weight="700">.env · 先填两项，其余自动完成</text><g font-size="18"><text x="32" y="100" fill="#c4b5fd">NOTION_TOKEN=填写你自己的令牌</text><text x="32" y="145" fill="#c4b5fd">NOTION_PARENT_PAGE_URL=粘贴已授权的父页面链接</text><text x="32" y="195">API_TOKEN=启动器自动生成，请保留</text><text x="32" y="240">AI_PROVIDER=mock　　MOCK_AI=true</text><text x="32" y="285" fill="#a1a1aa">先验证流程；要用真实 AI，再到设置填写 DeepSeek 密钥。</text></g><text x="32" y="329" font-size="14" fill="#a1a1aa">示意图，不是真实配置截图。保存后再次双击 start.command。</text></g></svg>
