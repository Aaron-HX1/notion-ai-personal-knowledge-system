services:
  - type: web
    name: notion-knowledge-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/migrate.js && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_BACKEND
        value: s3
      - key: DATABASE_URL
        fromDatabase:
          name: notion-knowledge-db
          property: connectionString
      - key: API_TOKEN
        generateValue: true
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_KNOWLEDGE_DATA_SOURCE_ID
        sync: false
      - key: NOTION_COLLECTIONS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_JOBS_DATA_SOURCE_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
  - type: worker
    name: notion-knowledge-worker
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_BACKEND
        value: s3
      - key: DATABASE_URL
        fromDatabase:
          name: notion-knowledge-db
          property: connectionString
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_KNOWLEDGE_DATA_SOURCE_ID
        sync: false
      - key: NOTION_COLLECTIONS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_JOBS_DATA_SOURCE_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
databases:
  - name: notion-knowledge-db
    region: singapore
    plan: 0.1c-256mb
    ipAllowList: []
