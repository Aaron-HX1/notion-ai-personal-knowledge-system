<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="五步部署流程示意"><rect width="960" height="270" rx="24" fill="#fafafa"/><g font-family="sans-serif" fill="#18181b"><text x="32" y="45" font-size="24" font-weight="700">KnowledgeBot · 从收到 ZIP 到打开控制台</text><text x="32" y="78" font-size="14" fill="#71717a">先完成自己的 Notion 授权，再双击启动；无需外部数据库。</text><g font-size="17" text-anchor="middle"><g transform="translate(30 110)"><rect width="164" height="115" rx="16" fill="white" stroke="#e4e4e7"/><text x="82" y="34" fill="#7c3aed">01</text><text x="82" y="65">安装 Node.js</text><text x="82" y="91" font-size="12" fill="#71717a">官方 macOS LTS</text></g><g transform="translate(214 110)"><rect width="164" height="115" rx="16" fill="white" stroke="#e4e4e7"/><text x="82" y="34" fill="#7c3aed">02</text><text x="82" y="65">创建 Notion 机器人</text><text x="82" y="91" font-size="12" fill="#71717a">授权自己的私有页面</text></g><g transform="translate(398 110)"><rect width="164" height="115" rx="16" fill="white" stroke="#e4e4e7"/><text x="82" y="34" fill="#7c3aed">03</text><text x="82" y="65">填写 .env</text><text x="82" y="91" font-size="12" fill="#71717a">Token + 父页面链接</text></g><g transform="translate(582 110)"><rect width="164" height="115" rx="16" fill="white" stroke="#e4e4e7"/><text x="82" y="34" fill="#7c3aed">04</text><text x="82" y="65">双击 start.command</text><text x="82" y="91" font-size="12" fill="#71717a">自动安装、建库、启动</text></g><g transform="translate(766 110)"><rect width="164" height="115" rx="16" fill="#18181b"/><text x="82" y="34" fill="#c4b5fd">05</text><text x="82" y="65" fill="white">打开控制台</text><text x="82" y="91" font-size="12" fill="#d4d4d8">设置 → 测试连接</text></g></g></g></svg>
