<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-label="Notion 授权操作示意，不是真实账号截图"><rect width="960" height="370" rx="24" fill="#fafafa"/><g font-family="sans-serif" fill="#18181b"><text x="32" y="44" font-size="24" font-weight="700">Notion 授权：两处操作缺一不可</text><g transform="translate(32 75)"><rect width="425" height="260" rx="16" fill="white" stroke="#e4e4e7"/><text x="24" y="36" font-size="18" font-weight="700">① 开发者后台 → 新建内部集成</text><text x="24" y="78" font-size="16">名称：KnowledgeBot</text><text x="24" y="112" font-size="16">工作空间：选择你自己的工作空间</text><text x="24" y="152" font-size="16">✓ 读取内容　✓ 插入内容　✓ 更新内容</text><text x="24" y="195" font-size="16">复制 Internal Integration Secret</text><text x="24" y="231" font-size="13" fill="#71717a">不要将 Token 发给朋友或粘贴到公开网页</text></g><g transform="translate(487 75)"><rect width="441" height="260" rx="16" fill="white" stroke="#e4e4e7"/><text x="24" y="36" font-size="18" font-weight="700">② 新建私有页面 → 右上角「…」</text><text x="24" y="78" font-size="16">页面名称：AI Knowledge System</text><text x="24" y="116" font-size="16">连接 / Connections → 添加 KnowledgeBot</text><text x="24" y="154" font-size="16">复制页面链接 → 填入 .env</text><text x="24" y="193" font-size="16" fill="#7c3aed">无需把页面公开到互联网</text><text x="24" y="231" font-size="13" fill="#71717a">启动器在该页面下自动创建三个数据库</text></g></g></svg>
